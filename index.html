<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>my snowglobe</title> 
        <link rel="stylesheet" href="my-snowglobe/style.css">
    </head>
    <body>
        <header class="hero">
        <h1>my snowglobe</h1>
        <p class="tagline">shake it for a little  kindness</p>
        </header>
        <main>
            <div class="flake" aria-hidden="true"></div>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img  class="scene" src="snowglobe.png" alt="a snowglobe" />                
                </div>
                <button id="shake">shake the globe</button>
                <p class="message" id="message">press the button and see what settles</p>
                <div class="custom-input">
                    <input type="text" id="user-note" placeholder="Write a kind note..." />
                    <button id="add-note">Add Note</button>
                </div>
            </section>
        </main>
        <footer>
            <p id="ps">made by me, in the snow</p>
            <p id="ps">@Hana</p>
        </footer>
        <script src="my-snowglobe/script.js"></script>
    </body>

</html>
